name: CI
on: 
  pull_request:
  push:
    branches:
      - main
jobs:
  # H1 (PLAN_HARNESS): maintenance-invariant gate. Cross-checks the op-count
  # header against the sibling unfer AGENT_OPS census.
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout unfer as sibling (op-census cross-check)
        uses: actions/checkout@v4
        with:
          repository: leonardopedro/unfer
          path: ../unfer
      - name: Run scripts/verify-invariants (H1)
        run: bash scripts/verify-invariants

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt
      - run: cargo +nightly fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      # Note: not --all-features: delta_algebra/delta_sirk pin wgpu 27 while
      # bevy 0.19 pulls wgpu 29; naga 27 fails codespan-reporting's termcolor
      # gate when both stacks build in one combined check (round-18 follow-up
      # in IMPROVEMENT_PLAN.md). Individual crates and subsets build clean.
      - run: cargo check --workspace --all-targets

  check-no-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - run: cargo check --workspace --no-default-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - run: rustup component add clippy
      # Note: not --all-features (round-18 follow-up, IMPROVEMENT_PLAN.md):
      # wgpu-27 (delta_*) + wgpu-29 (bevy) break naga 27 in one combined build.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      # Note: not --all-features (round-18 follow-up, IMPROVEMENT_PLAN.md):
      # wgpu-27 (delta_*) + wgpu-29 (bevy) break naga 27 in one combined build.
      - run: cargo doc --workspace --no-deps --document-private-items --features="bevy/wayland"
        env:
          RUSTDOCFLAGS: -D warnings
    
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      # Note: not --all-features (round-18 follow-up, IMPROVEMENT_PLAN.md):
      # wgpu-27 (delta_*) + wgpu-29 (bevy) break naga 27 in one combined build.
      - run: cargo test --workspace --all-targets

  # Note: cargo test --all-targets disables doc tests, so we have to add this to test docs
  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      # Note: not --all-features (round-18 follow-up, IMPROVEMENT_PLAN.md):
      # wgpu-27 (delta_*) + wgpu-29 (bevy) break naga 27 in one combined build.
      - run: cargo test --workspace --doc

  # Stage C10: headless kernel smoke — no display server needed.
  # mathed: document → KernelBridge → worker → prob_kernel → annotation
  #   appears in the transformed Typst source (green value / red error).
  # mathed_mini: same document rendered to an RGBA8 image; green pixels
  #   for a successful prob, red pixels for an error.
  # Fails if the kernel path breaks end-to-end.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: mathed headless kernel smoke (transformed source)
        run: cargo test -p mathed kernel_smoke
      - name: mathed_mini headless kernel smoke (rasterized pixels)
        run: cargo test -p mathed_mini overlay_renders_green

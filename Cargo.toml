[workspace]
resolver = "2"
members = ["crates/*", "crates/delta_sirk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/velyst"
readme = "README.md"

[workspace.dependencies]
typst_element = { path = "crates/typst_element", version = "0.1.0" }
typst_imaging = { path = "crates/typst_imaging", version = "0.1.0" }
kanva = { path = "crates/kanva", version = "0.1.0" }

# Bevy dependencies
bevy = { version = "0.18.1", default-features = false, features = [
  "default_app",
  "bevy_winit",
  "x11",
  "wayland",
  "2d_bevy_render",
  "ui_bevy_render",
  "bevy_remote",
] }
bevy_vello = "0.13.1"
# Vello dependencies
vello = "0.7.0"
vello_svg = "0.9.0"
# Imaging dependencies
imaging = { git = "https://github.com/forest-rs/imaging", rev = "79f02ae", default-features = false }
svg_imaging = { git = "https://github.com/forest-rs/imaging", rev = "79f02ae", default-features = false }
imaging_vello = { git = "https://github.com/forest-rs/imaging", rev = "79f02ae", default-features = false, features = ["vello-0-7"] }
# Peniko/Kurbo
peniko = { version = "0.6", features = ["std"] }
# Typst dependencies
typst = "0.14.2"
typst-library = "0.14.2"
typst-eval = "0.14.2"
typst-layout = "0.14.2"
typst-assets = "0.14.2"
# In sync with Typst:
unicode-math-class = "0.1"
ttf-parser = "0.25"
hayro = "0.4"
wgpu = "27"
hayro-svg = "0.2"
# Other
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = "2"
flate2 = "1"
tar = "0.4"
dirs = "5"
hashbrown = "0.17"
ecow = { version = "0.2", features = ["serde"] }
thiserror = "2.0.18"
smallvec = "1.15.1"
paste = "1"
num-complex = "0.4.6"
rustc-hash = "2.1.1"
rayon = "1.11.0"
nalgebra = "0.34.1"
pest = "2.8.6"
pest_derive = "2.8.6"
serde = { version = "1", features = ["derive"] }

# Terminal
alacritty_terminal = "0.25.1"
portable-pty = "0.9.0"
arboard = "3.6.1"

[workspace.lints.clippy]
redundant_type_annotations = "warn"
bool_comparison = "allow"
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 0

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_scene = { git = "https://github.com/bevyengine/bevy", tag = "v0.18.1" }

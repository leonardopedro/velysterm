[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]
exclude = [
    "/.github/",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/velyst"
readme = "README.md"

[workspace.dependencies]
# velyst is consumed as an external crate from the upstream repository
# (github.com/voxell-tech/velyst), pinned to the v0.0.1 release tag.  This
# workspace no longer vendors a fork: `velyst`, `kanva`, `kanva_svg`,
# `kanva_typst` and `typst_imaging` all live upstream.  `typst_imaging` is not
# published on crates.io yet, so it is taken from the same tag.
velyst = { git = "https://github.com/voxell-tech/velyst", tag = "v0.0.1" }
typst_imaging = { git = "https://github.com/voxell-tech/velyst", tag = "v0.0.1" }

# Bevy dependencies (in sync with upstream velyst main: bevy 0.19 / vello 0.9).
# Feature set avoids the `2d`/`default_platform` aggregates, which pull
# `bevy_gilrs` → libudev-sys (a system udev dev dependency not present in this
# project's build environments). The specific pieces cover everything mathed /
# the vendored velyst use: windowing, 2D render + camera, UI, remote, state.
#
# That avoidance is only partly effective, and it is worth being precise about
# why. `bevy_vello` depends on `bevy` *with its default features*, so Cargo's
# feature unification switches `bevy_gilrs` back on for any crate that reaches
# bevy through it — the `default-features = false` above cannot win against a
# dependency that asks for the defaults. The resulting chain is:
#
#     mathed → bevy_vello → bevy (defaults) → bevy_gilrs → gilrs → libudev-sys
#
# so building `mathed` still needs libudev and pkg-config, even though nothing
# here asks for a gamepad:
#
#     nix-shell -p systemd pkgconf --run "cargo test -p mathed"
#
# `mathed_core`, `mathed_mini` and `delta_algebra` are Bevy-free and build with
# no system dependencies, which is why `emthin` (a path dependent on the first
# two) is unaffected.
bevy = { version = "0.19", default-features = false, features = [
  "std",
  "default_app",
  "2d_bevy_render",
  "bevy_ui",
  "bevy_winit",
  "x11",
  "wayland",
  "multi_threaded",
  "default_font",
  "bevy_remote",
] }
bevy_vello = "0.14"
# Vello dependencies
vello = "0.9.0"
vello_svg = "0.9.0"
# Imaging dependencies
imaging = { version = "0.0.1", default-features = false }
svg_imaging = { version = "0.0.1", default-features = false }
imaging_vello = { version = "0.0.2", default-features = false, features = ["vello-0-9"] }
# Typst dependencies
typst = "0.15"
typst-library = "0.15"
typst-eval = "0.15"
typst-layout = "0.15"
typst-assets = "0.15"
# In sync with Typst:
unicode-math-class = "0.1"
ttf-parser = "0.25"
hayro = "0.4"
# wgpu generation aligned with the bevy 0.19 / vello-0-9 stack (wgpu 29)
wgpu = "29"
hayro-svg = "0.7"
usvg = { version = "0.47.0", default-features = false, features = ["text"] }
image = { version = "0.25", default-features = false }
# Other
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = "2"
flate2 = "1"
tar = "0.4"
dirs = "5"
hashbrown = "0.17"
ecow = { version = "0.2", features = ["serde"] }
thiserror = "2.0.18"
smallvec = "1.15.1"
paste = "1"
num-complex = "0.4.6"
rustc-hash = "2.1.1"
rayon = "1.11.0"
nalgebra = "0.34.1"
pest = "2.8.6"
pest_derive = "2.8.6"
serde = { version = "1", features = ["derive"] }

# Document model
loro = "1.13"

# Property-based testing
proptest = "1"
mathed_core = { path = "crates/mathed_core", version = "0.1.0" }

# Terminal
alacritty_terminal = "0.25.1"
portable-pty = "0.9.0"
arboard = "3.6.1"

[workspace.lints.clippy]
redundant_type_annotations = "warn"
bool_comparison = "allow"
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 0

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

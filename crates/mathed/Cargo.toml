[package]
name = "mathed"
description = "Math-semantics editor: Loro document, hidden markers, Typst rendering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mathed_core = { workspace = true }
kernel_client = { path = "../kernel_client" }
# The translator pipeline + kernel bridge (P3 #10/#11). `default-features =
# false` drops the winit/softbuffer `gui` frontend; we only use the headless
# KernelBridge (translator → dispatcher → worker), so the `kernel` feature
# must be requested explicitly — without it `mathed_mini` compiles with
# `KernelBridge`/`KernelResult` cfg'd out and `kernel_sys` cannot import
# them (visible only in isolated `cargo check -p mathed`; a whole-workspace
# build masks it via feature unification with mathed_mini's own defaults).
# Safe unconditionally: `mathed` already depends on `kernel_client` and
# `unfer_ffi` directly, so no dependency edge is added.
mathed_mini = { path = "../mathed_mini", default-features = false, features = ["kernel"] }
velyst = { workspace = true }
bevy = { workspace = true }
bevy_vello = { workspace = true }
typst = { workspace = true }
arboard = "3.6.1"
# H4 durable-store status dashboard: the mathed GUI consults the unfer
# kernel's store read-only (backend, persist counter, stream lengths,
# corrupt-snapshot recovery report). unfer_ffi is rlib-compatible.
unfer_ffi = { path = "../../../unfer/unfer_ffi" }
unfer_protocol = { path = "../../../unfer/unfer_protocol" }

[lints]
workspace = true

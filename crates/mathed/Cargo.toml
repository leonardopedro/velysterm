[package]
name = "mathed"
description = "Math-semantics editor: Loro document, hidden markers, Typst rendering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mathed_core = { workspace = true }
kernel_client = { path = "../kernel_client" }
# The translator pipeline + kernel bridge (P3 #10/#11). `default-features =
# false` drops the winit/softbuffer `gui` frontend; we only use the headless
# KernelBridge (translator → dispatcher → worker).
mathed_mini = { path = "../mathed_mini", default-features = false }
velyst = { path = "../velyst", version = "0.1.0" }
bevy = { workspace = true }
bevy_vello = { workspace = true }
typst = { workspace = true }
arboard = "3.6.1"
# H4 durable-store status dashboard: the mathed GUI consults the unfer
# kernel's store read-only (backend, persist counter, stream lengths,
# corrupt-snapshot recovery report). unfer_ffi is rlib-compatible.
unfer_ffi = { path = "../../../unfer/unfer_ffi" }
unfer_protocol = { path = "../../../unfer/unfer_protocol" }

[lints]
workspace = true

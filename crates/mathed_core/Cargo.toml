[package]
name = "mathed_core"
description = "Document model for the mathed editor: Loro-backed source text with hidden semantic markers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
loro = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
typst = { workspace = true }
unicode-math-class = { workspace = true }
unicode-segmentation = "1"
# D-C4 / D10: the advisory ranking in `rank`. Both frontends already reach
# `decide_core` through `kernel_client`, so this adds no edge to either binary
# — it only lets the shared list-ordering live in the one crate both frontends
# share instead of being written twice.
decide_core = { path = "../../../unfer/decide_core" }
nalgebra = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

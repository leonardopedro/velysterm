[package]
name = "mathed_mini"
description = "Minimal, Bevy-free math editor frontend: typst_imaging (CPU) renderer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mathed_core = { path = "../mathed_core" }
mathed_biblio = { path = "../mathed_biblio" }
typst_imaging = { workspace = true }

# Kernel contract types: the translator pipeline parses translator output
# into TermSpec/ModelSpec (P3 #10). Serde types only — no Bevy, no solver.
# Optional because the `kernel` feature owns every module that reads them;
# when it is off the types are still a *dev*-dependency (below), which is
# what the translate/output_region contract tests need.
unfer_protocol = { path = "../../../unfer/unfer_protocol", optional = true }
serde_json = "1.0"
# Data-URL image payloads (`#image("data:image/png;base64,…")`)
# resolved by the minimal world — already in the lockfile.
base64 = "0.22"
# PNG encoding for the headless `--region-image` screenshot (the
# plot e2e's rendered notebook page) — already in the lockfile.
png = "0.18"
# zlib/flate compression for the minimal PDF writer (`--pages-pdf`,
# FlateDecode-encoded DeviceRGB page bitmaps) — already in the
# lockfile (pulled transitively by other crates).
flate2 = "1.1"

# The probability kernel client (worker thread + Session). Pulls prob_kernel
# (P3 #11: wire kernel_client into mathed_mini) so a \prob computes a real
# number off the render thread. Behind the `kernel` feature: prob_kernel's
# dependency tree reaches quantrs2 -> scirs2-core, which has no SIMD path for
# the `x86_64-linux-android` target and therefore does not compile there. A
# frontend for such a platform takes `--no-default-features`, keeping the
# render core (this crate's whole point) and dropping the kernel integration.
kernel_client = { path = "../kernel_client", optional = true }
# H4 durable-store status dashboard: the TUI consults the unfer kernel's
# store read-only (backend, persist counter, stream lengths, corrupt-
# snapshot recovery report). unfer_ffi is rlib-compatible.
unfer_ffi = { path = "../../../unfer/unfer_ffi", optional = true }

typst = { workspace = true }
typst-library = { workspace = true }
typst-eval = { workspace = true }
typst-layout = { workspace = true }
typst-assets = { workspace = true, features = ["fonts"] }

# CPU rasterizer (software vello) + the shared RGBA8 image type. No GPU, so the
# renderer runs on constrained hardware.
imaging = { workspace = true, features = ["std"] }
imaging_vello_cpu = { version = "0.0.2", features = ["std"] }

# Optional lightweight windowing — kept behind the `gui` feature so the render
# core stays headless-capable. winit 0.30 matches the one Bevy already pulls.
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
# AccessKit bridge over mathed_core::accessibility (P4 #22). Optional so the
# headless render core stays dependency-free.
accesskit = { version = "0.21", optional = true }
accesskit_winit = { version = "0.29", optional = true }
# System clipboard for copy/paste (P5 #25). Reuses the workspace version Bevy
# already pulls; optional so the headless render core stays dependency-free.
arboard = { version = "3.6.1", optional = true }

[dev-dependencies]
# The compile-time contract tests in `translate` / `output_region` assert the
# builtin translator's JSON against the kernel's real serde schema. They run on
# every target, including builds that take `--no-default-features` and so have
# no `kernel` feature — hence the duplicate, non-optional dev entry.
unfer_protocol = { path = "../../../unfer/unfer_protocol" }

[features]
default = ["gui"]
gui = [
    "dep:winit",
    "dep:softbuffer",
    "dep:accesskit",
    "dep:accesskit_winit",
    "dep:arboard",
    "kernel",
]
# The unfer probability kernel integration: the KernelBridge, the dispatcher,
# the export/screenshot paths, the kernel menu and the durable dashboard. On
# by default — every existing frontend wants it. Off only where the kernel's
# own dependency tree cannot be built (see `kernel_client` above).
kernel = ["dep:kernel_client", "dep:unfer_ffi", "dep:unfer_protocol"]

[[bin]]
name = "mathed_mini"
required-features = ["gui"]

[lints]
workspace = true
